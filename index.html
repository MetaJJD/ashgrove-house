<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Greywater</title>
<meta name="description" content="Greywater — a cooperative, turn-based horror game in the style of Mansions of Madness, for 1–4 players on phones and computers.">
<meta name="theme-color" content="#0b0908">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0908;--panel:#17110d;--panel2:#201813;--line:#3b2f26;--line2:#5a463a;--ink:#eadfc9;--dim:#a8977c;--candle:#e2a94b;--blood:#a8282b;--hp:#c4554c;--san:#8a9ae0;--clue:#d9c46a;--good:#93b88a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Crimson Pro',Georgia,serif;font-size:17px;line-height:1.4;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{background:radial-gradient(ellipse 120% 70% at 50% -10%,#2a1d15 0%,#120d0a 45%,#0b0908 75%) fixed}
h1,h2,h3{font-family:'IM Fell English SC',Georgia,serif;font-weight:400;letter-spacing:.03em;margin:0}
i,em{font-family:'IM Fell English',Georgia,serif}
button{font:inherit;color:var(--ink);background:linear-gradient(#2c231d,#1c1612);border:1px solid var(--line2);border-radius:7px;padding:9px 14px;cursor:pointer;min-height:44px;text-align:left}
button:hover:not(:disabled){border-color:var(--candle)}
button:disabled,button.off{opacity:.45;cursor:not-allowed}
button.primary{background:linear-gradient(#8b2224,#531315);border-color:#b8383a;text-align:center}
button.ghost{background:transparent}
button.small{min-height:36px;padding:5px 11px;font-size:15px}
button small{display:block;font-size:13px;color:var(--dim)}
input{font:inherit;color:var(--ink);background:#0f0b09;border:1px solid var(--line2);border-radius:7px;padding:9px 12px;min-height:44px;text-transform:uppercase;letter-spacing:.2em;width:9em}
input.nm-in{text-transform:none;letter-spacing:normal;width:13em}
input:focus{outline:none;border-color:var(--candle)}
small,.dim{color:var(--dim)}
.eyebrow{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:10px 0 4px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.list button{display:flex;justify-content:space-between;gap:10px;width:100%}
.pass{color:var(--good)}.fail{color:#ff7c72}
#app{position:relative}

/* home / lobby */
.home{max-width:800px;margin:0 auto;padding:max(30px,env(safe-area-inset-top)) 18px 60px}
.title{text-align:center;margin:10px 0 26px}
.title h1{font-size:clamp(50px,11vw,90px);line-height:1;text-shadow:0 0 22px rgba(226,169,75,.35);animation:flicker 7s infinite}
.title p{font-family:'IM Fell English',serif;font-style:italic;color:var(--dim);max-width:560px;margin:14px auto 0;font-size:18px}
@keyframes flicker{0%,100%,47%,49%,74%{opacity:1}48%{opacity:.72}73%{opacity:.9}}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:12px;padding:18px}
.card+.card{margin-top:14px}
.card h2{font-size:24px;margin-bottom:10px}
.code{font-family:'IM Fell English SC',serif;font-size:46px;letter-spacing:.18em;color:var(--candle)}
.invgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:10px;margin-top:12px}
.invc{position:relative;border:1px solid var(--line);border-radius:10px;padding:12px;background:#120e0b;display:block;width:100%}
.invc.mine{border-color:var(--candle);box-shadow:0 0 0 1px var(--candle) inset}
.invc.taken{opacity:.45}
.invc .nm{font-family:'IM Fell English SC',serif;font-size:20px;display:flex;align-items:center;gap:10px}
.role{font-style:italic;font-family:'IM Fell English',serif;color:var(--dim);font-size:15px}
.invc .tag{position:absolute;top:10px;right:10px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--candle)}
.stats{display:flex;gap:5px;margin:8px 0 6px;flex-wrap:wrap}
.stat{font-size:12.5px;letter-spacing:.05em;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--dim)}
.stat b{color:var(--ink)}
.stat.h{color:#e07a72}.stat.s{color:#a5b2ee}.stat.low b{color:#ff7c72}.stat.high b{color:var(--good)}
.abil{font-size:14.5px;color:var(--dim);margin:6px 0}
.abil b{color:var(--ink)}

/* game */
.g{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
.top{display:flex;align-items:center;gap:8px;padding:6px 10px;background:linear-gradient(#1c1510,#130e0b);border-bottom:1px solid var(--line);flex-wrap:wrap}
.top h1{font-size:24px;margin-right:4px}
.top .sp{flex:1}
.pill{font-size:14px;border:1px solid var(--line2);border-radius:999px;padding:2px 10px;color:var(--dim)}
.pill.goal{color:var(--clue);border-color:#6e5f2a}
.net{font-size:13px;color:var(--dim);max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#board{flex:1;position:relative;overflow:hidden;touch-action:none;background:radial-gradient(ellipse at center,#100c0a,#050403);user-select:none;-webkit-user-select:none}
#board>svg{width:100%;height:100%;display:block}
.space{fill:transparent;stroke:rgba(255,248,230,.32);stroke-width:2;stroke-dasharray:10 8}
.space.here{stroke:var(--candle);stroke-width:4;stroke-dasharray:none}
.space.reach{fill:rgba(226,169,75,.18);stroke:var(--candle);stroke-width:5;stroke-dasharray:none;cursor:pointer;animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{50%{fill:rgba(226,169,75,.07);stroke-opacity:.5}}
.tag text{font-family:'IM Fell English SC',serif;font-size:19px;fill:#2a1d12}
.tok,.fig,.mon{cursor:pointer}
.tok:hover,.fig:hover,.mon:hover{filter:brightness(1.25)}
.tok.explore.live circle:first-child{animation:glowp 1.4s ease-in-out infinite}
@keyframes glowp{50%{stroke:#fff3c4;stroke-width:6}}
.fig.done{opacity:.72}
.mon text{font-family:'IM Fell English SC',serif;font-size:26px;fill:#ffb3b3;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.mon.boss text{fill:#e7e0ff}
.hud{background:linear-gradient(#18120e,#0f0b09);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}
.chips{display:flex;gap:8px;overflow-x:auto;flex:1 1 520px;min-width:0;-webkit-overflow-scrolling:touch}
.chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:#140f0c;cursor:pointer;flex:none}
.chip.active{border-color:var(--candle);box-shadow:0 0 12px rgba(226,169,75,.35)}
.chip.done{opacity:.7}.chip.out{opacity:.4}
.chip .cn{font-family:'IM Fell English SC',serif;font-size:16px;white-space:nowrap}
.chip .cs{display:flex;gap:8px;font-size:13.5px;flex-wrap:wrap}
.cs .h{color:#e07a72}.cs .s{color:#a5b2ee}.cs .c{color:var(--clue)}
.cs .tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;border-radius:4px;padding:0 5px}
.cs .tag.w{background:#5b1a17;color:#ffc9c0}.cs .tag.i{background:#2b2f5e;color:#d6dcff}
.cst{font-size:12.5px;color:var(--dim)}
.turnbox{display:flex;flex-direction:column;justify-content:center;gap:6px;flex:0 1 auto}
.cands{display:inline-flex;gap:4px;vertical-align:middle;margin-left:6px}
.candle{width:9px;height:20px;border-radius:3px;background:#3a2e26;position:relative}
.candle.on{background:linear-gradient(#f1e3c0,#c9b48a)}
.candle.on::before{content:"";position:absolute;left:1px;top:-9px;width:7px;height:10px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(#fff6c8,#e2a94b 60%,transparent 70%);animation:flame 1.2s ease-in-out infinite}
@keyframes flame{50%{transform:scaleY(.8) translateY(1px)}}
.sheet{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:min(560px,calc(100% - 16px));max-height:calc(100% - 20px);overflow:auto;background:linear-gradient(180deg,#241b15,#16100c);border:1px solid var(--line2);border-radius:14px;padding:16px 16px 14px;box-shadow:0 18px 60px #000;z-index:5}
.sheet .x{position:absolute;right:8px;top:8px;min-height:36px;padding:2px 12px;font-size:22px;background:transparent;border:0}
.sheet h2{font-size:25px;padding-right:36px}
.sh-head{display:flex;gap:12px;align-items:center}
.flav{font-family:'IM Fell English',serif;font-style:italic;color:var(--dim);margin:8px 0}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-top:10px}
.items{display:flex;flex-direction:column;gap:6px}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.it small{display:block}
.chips2{display:flex;gap:6px;flex-wrap:wrap}.chip2{font-size:13.5px;border:1px solid var(--line2);border-radius:999px;padding:2px 9px}.chip2.bad{border-color:#7a2e2a;color:#ffb3a8}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;font-size:14px;margin:8px 0}
.bar{height:9px;border-radius:5px;background:#0c0908;border:1px solid var(--line);overflow:hidden}.bar i{display:block;height:100%}
.bar.hp i{background:linear-gradient(90deg,#7a221d,var(--hp))}.bar.san i{background:linear-gradient(90deg,#3f4a87,var(--san))}
b.w{color:#ff9c90}b.i{color:#b9c3ff}
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(380px,92%);background:linear-gradient(180deg,#1c1510,#110c09);border-left:1px solid var(--line2);padding:12px 14px;overflow:auto;z-index:6;box-shadow:-14px 0 40px #000}
.dh{display:flex;justify-content:space-between;align-items:center}
.log{font-size:15px;margin-top:10px}
.log div{padding:4px 0;border-top:1px dashed #2c241e}
.log .bad{color:#e8a397}.log .dire{color:#ff7c72;font-weight:600}.log .good{color:#b9d3a8}.log .clue{color:var(--clue)}.log .myth{color:#c4b9ef}
.log .round{color:var(--candle);font-family:'IM Fell English SC',serif;text-align:center;border-top:1px solid var(--line2)}
.mad #board{animation:mad 9s ease-in-out infinite}
@keyframes mad{30%{filter:hue-rotate(-14deg) saturate(1.3)}33%{transform:translateX(1.5px) skewX(.3deg)}35%{transform:none}70%{filter:blur(.4px) hue-rotate(10deg)}}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translate(-5px,2px)}40%{transform:translate(4px,-3px)}60%{transform:translate(-3px,1px)}80%{transform:translate(2px,2px)}}

/* modals */
.mback{position:fixed;inset:0;background:rgba(5,3,2,.78);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;animation:fade .2s;backdrop-filter:blur(2px)}
@keyframes fade{from{opacity:0}}
.modal{background:linear-gradient(180deg,#241b15,#15100d);border:1px solid var(--line2);border-radius:14px;max-width:540px;width:100%;padding:22px;max-height:88vh;overflow:auto;box-shadow:0 20px 70px #000}
.modal h2{font-size:29px;margin:2px 0 8px}
.modal p{margin:8px 0}
.modal .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.story p{font-family:'IM Fell English',serif;font-size:18.5px}
.story.mythos h2{color:#c9bdf5}.story.reveal h2,.story.evidence h2{color:var(--clue)}.story.lost h2,.story.dire h2{color:#ff7c72}.story.won h2{color:var(--clue)}
.modal.insane{border-color:#5560a8}.modal.insane h2{color:#b9c3ff}
.dice{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin:18px 0 12px}
.die{width:52px;height:52px;border-radius:10px;background:#e8dcc4;color:#2a1d14;display:grid;place-items:center;font-size:26px;box-shadow:0 3px 0 #7a6a52,inset 0 0 8px #0002;clip-path:polygon(50% 0,100% 30%,100% 70%,50% 100%,0 70%,0 30%)}
.die.rolling{animation:tumble .14s linear infinite}
@keyframes tumble{50%{transform:rotate(14deg) translateY(-3px)}}
.die.S,.die.X,.die.K{background:linear-gradient(#f3c66c,#d3962f);color:#3b1f00}
.die.C{background:linear-gradient(#9dabeb,#5c6cbd)}
.die.X{box-shadow:0 0 0 3px #9dabeb inset}
.die.B{opacity:.55}
.dflav{font-style:italic;color:#cdbf9f;text-align:center;margin:4px 6px 10px;line-height:1.4}.dout{display:block;font-style:italic;color:#e6dcc2;margin-top:6px}
.dsum{text-align:center;font-size:19px}
.tf{display:inline-flex;gap:4px}.tf .f{font-style:normal;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:5px;background:#3a2e26;font-size:14px}.tf .S,.tf .X{background:#d3962f}.tf .C{background:#5c6cbd}
.toasts{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,520px)}
.toast{background:#231a14;border:1px solid var(--line2);border-radius:9px;padding:10px 14px;box-shadow:0 8px 30px #000;animation:fade .2s;font-size:15.5px;text-align:center}
.trade{display:grid;grid-template-columns:1fr 1fr;gap:12px}.trade>div{display:flex;flex-direction:column;gap:6px}.trade .moved{border-color:var(--candle)}
.rules h3{font-size:19px;margin-top:14px;color:var(--candle)}
.rules p{margin:6px 0}
.fireov{animation:fire 1.1s ease-in-out infinite alternate}@keyframes fire{to{opacity:.38}}
.flame{animation:flick .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes flick{to{transform:scaleY(.85) skewX(4deg)}}
.it.spell{border-color:#4b4380}.it.spell b{color:#c9bdf5}
.modal.puzzle{max-width:560px}
.pzbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:6px 0 10px;flex-wrap:wrap}
.pgh{display:flex;flex-direction:column;gap:4px;margin:8px 0;max-height:180px;overflow:auto}
.pg{display:flex;gap:10px;align-items:center}.pg b{color:var(--clue);letter-spacing:2px}.pg b.nr{color:#c9bdf5}
.stop{font-style:normal;display:inline-block;border-radius:5px;padding:1px 7px;margin-right:3px;font-size:14px;color:#1a120c;border:1px solid #0004}
.stop.s0{background:#d9b84a}.stop.s1{background:#9dc7a5}.stop.s2{background:#d98c6a}.stop.s3{background:#9dabeb}.stop.s4{background:#e6d8f0}
button.stop{min-height:40px;font-size:15px}
.slots{display:flex;gap:8px;justify-content:center;margin:10px 0}.slot{min-width:84px;min-height:38px;border:1px dashed var(--line2);border-radius:6px;display:grid;place-items:center;cursor:pointer}
.palette{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
.slide{display:flex;align-items:center;justify-content:center;gap:6px}
.sgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;width:min(300px,70vw);aspect-ratio:1;background:#120d0a;padding:4px;border-radius:8px;border:2px solid #3a2a1a}
.sc{border-radius:5px;display:grid;place-items:center;font-size:22px;cursor:pointer}.sc.e{background:#1f1813}.sc.p{box-shadow:inset 0 0 0 2px #0007,inset 0 3px 0 #fff2}.sc.sel{outline:3px solid var(--candle)}
.sexit{writing-mode:vertical-rl;color:var(--clue);font-size:13px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;width:min(300px,78vw);aspect-ratio:1;margin:0 auto;background:#120d0a;padding:3px;border-radius:6px}
.pgrid .pt{overflow:hidden;cursor:pointer;border-radius:2px}.pgrid .pt.sel{outline:3px solid var(--candle);outline-offset:-3px}
.pipes{display:grid;grid-template-columns:24px auto 24px;grid-template-rows:repeat(4,1fr);align-items:center;justify-content:center;gap:0 4px}
.pipes .pg4{grid-column:2;grid-row:1/5;display:grid;grid-template-columns:repeat(4,1fr);gap:2px;width:min(300px,70vw);aspect-ratio:1}
.pipes .pin{grid-column:1;color:#5b8fd9;font-size:20px}.pipes .pout{grid-column:3;color:#5b8fd9;font-size:20px}
.pp{cursor:pointer;border-radius:4px;overflow:hidden}
@media (max-width:640px){.top{gap:6px;padding:5px 8px}.top h1{display:none}.pill{font-size:12.5px;padding:2px 8px}.top .net{display:none}.top .sp{display:none}.top button.small{min-height:34px;padding:3px 9px;font-size:14px}.chip .cst{display:none}.chip{padding:4px 6px}.hud{padding:6px 8px calc(6px + env(safe-area-inset-bottom))}.turnbox .row button{flex:1}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toasts" id="toasts"></div>
<script src="peerjs.min.js"></script>
<script src="engine.js"></script>
<script src="actions.js"></script>
<script src="extras.js"></script>
<script src="puzzles.js"></script>
<script src="flavor.js"></script>
<script src="ui.js"></script>
<script src="net.js"></script>
<script>render(); initCaps();</script>
</body>
</html>
